name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 테스트 (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 = macOS 기본 python3 (런타임 헬퍼·훅은 여기서 돌아야 한다). 생성기와 그 테스트만 3.11+ (tomllib).
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: JSON 매니페스트 검증
        run: |
          python3 - <<'EOF'
          import json
          for f in (
              ".claude-plugin/marketplace.json",
              ".agents/plugins/marketplace.json",
              "plugins/pl/.claude-plugin/plugin.json",
              "plugins/pl/.codex-plugin/plugin.json",
          ):
              json.load(open(f))
              print(f, "OK")
          claude = json.load(open("plugins/pl/.claude-plugin/plugin.json"))
          codex = json.load(open("plugins/pl/.codex-plugin/plugin.json"))
          assert claude["version"] == codex["version"], f"plugin.json 버전 불일치: {claude['version']} vs {codex['version']}"
          assert claude["description"] == codex["description"], "plugin.json 설명 불일치"
          print("version sync OK", claude["version"])
          EOF
      - name: Python 테스트 스위트
        run: |
          S=plugins/pl/skills/team-pl-orchestrator/scripts
          python3 "$S/test_pl_config.py"
          python3 "$S/test_pl_history.py"
          python3 "$S/test_hooks.py"
          # tomllib 이 없는 3.9/3.10 에서는 스스로 skip 한다.
          python3 "$S/test_build_codex_agents.py"
          if python3 -c 'import tomllib' 2>/dev/null; then python3 "$S/build_codex_agents.py" --check; fi
      - name: 셸 하네스 3종
        run: |
          bash tests/pl-guard/run-unit.sh
          bash tests/pl-e2e/run-unit.sh
          bash tests/pl-codex/run-install-unit.sh

  shell:
    name: 셸 스크립트 (shellcheck + macOS bash 3.2)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning plugins/pl/install-codex.sh tests/pl-guard/run-unit.sh tests/pl-e2e/*.sh tests/pl-codex/*.sh
      - name: 셸 하네스 3종 (기본 python3 · bash)
        run: |
          bash --version | head -1; python3 --version
          bash tests/pl-guard/run-unit.sh
          bash tests/pl-e2e/run-unit.sh
          bash tests/pl-codex/run-install-unit.sh
      - name: Python 런타임 헬퍼 (기본 python3)
        run: |
          S=plugins/pl/skills/team-pl-orchestrator/scripts
          python3 "$S/test_pl_history.py"
          python3 "$S/test_hooks.py"

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: validate
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate plugins/pl
          claude plugin validate .

  version-guard:
    name: plugins/ 변경 시 버전 범프 강제
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 버전 범프 확인
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          # 설치 캐시가 버전 키라서, plugins/ 내용이 바뀌었는데 버전이 그대로면
          # 설치 사용자에게 변경이 전파되지 않는다. 이를 CI에서 강제한다.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            # 여러 커밋을 한 번에 push 해도 push 이전 시점과 비교한다 (HEAD~1 은 마지막 커밋만 본다).
            BASE="$PUSH_BEFORE_SHA"
            case "$BASE" in ""|0000000000000000000000000000000000000000) BASE=""; ;; esac
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then echo "기준 커밋 없음 — 통과"; exit 0; fi
          CHANGED=$(git diff --name-only "$BASE" HEAD -- plugins/ || true)
          if [ -z "$CHANGED" ]; then echo "plugins/ 변경 없음 — 통과"; exit 0; fi
          OLD=$(git show "$BASE:plugins/pl/.claude-plugin/plugin.json" 2>/dev/null \
            | python3 -c "import json,sys;print(json.load(sys.stdin).get('version',''))" || echo "")
          NEW=$(python3 -c "import json;print(json.load(open('plugins/pl/.claude-plugin/plugin.json'))['version'])")
          echo "plugins/ 변경 파일:"; echo "$CHANGED"
          echo "version: ${OLD:-(없음)} -> $NEW"
          python3 - "$OLD" "$NEW" <<'EOF'
          import re, sys
          old, new = sys.argv[1], sys.argv[2]
          def key(v):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", v or "")
              if not m:
                  sys.exit(f"::error::버전이 semver(x.y.z) 가 아닙니다: {v!r}")
              return tuple(int(x) for x in m.groups())
          if old and key(new) <= key(old):
              sys.exit(f"::error::plugins/ 내용이 변경되었지만 plugin.json 버전이 올라가지 않았습니다 ({old} -> {new}) — 버전을 올려야 설치 사용자에게 전파됩니다.")
          key(new)
          print("버전 범프 확인됨 — 통과")
          EOF
